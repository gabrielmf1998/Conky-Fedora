--[[
   pride.conf — painel detalhado no estilo do conky clássico (fundo preto,
   rótulos cinza, valores roxo, gráficos com gradiente vermelho/azul).
   Fedora rawhide · Ryzen 7 9800X3D · RTX 3060 Ti · KDE Wayland (XWayland)
]]

conky.config = {
    -- ── janela ────────────────────────────────────────────────
    own_window = true,
    own_window_class = 'Conky',
    own_window_title = 'conky-pride',
    own_window_type = 'normal',
    own_window_colour = '#00000000',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    alignment = 'top_right',
    gap_x = 16,
    gap_y = 16,
    minimum_width = 448,
    maximum_width = 448,
    border_inner_margin = 10,
    border_outer_margin = 0,

    double_buffer = true,
    no_buffers = true,
    background = false,

    -- ── fonte pequena, pixelada ───────────────────────────────
    use_xft = true,
    font = 'Terminus (TTF):pixelsize=11',
    xftalpha = 1.0,
    override_utf8_locale = true,
    text_buffer_size = 8192,
    use_spacer = 'none',

    -- ── cores da referência ───────────────────────────────────
    default_color = '8b8b93',    -- rótulos
    color0 = 'ffffff',           -- títulos de seção
    color1 = '8b8b93',           -- rótulos
    color2 = 'e9e9ef',           -- valores
    color3 = '655c73',           -- separadores
    color4 = 'a45cff',           -- SÓ gráficos e curvas
    color5 = 'ff5a4a',           -- alerta
    draw_shades = true,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = true,

    -- ── atualização ───────────────────────────────────────────
    update_interval = 1.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    top_name_width = 22,
    short_units = true,
    pad_percents = 0,
    format_human_readable = true,
}

conky.text = [[
${color0}${font Terminus (TTF):bold:pixelsize=12}${nodename}${font}${color1}   Linux ${color2}${execi 3600 uname -r | sed 's/\.x86_64$//'}${color1} on ${color2}${machine}
${color1}${execi 3600 . /etc/os-release; echo "$NAME $VERSION_ID"}${goto 200}${color1}up ${color2}${uptime}${alignr}${color1}since ${color2}${execi 60 uptime -s | cut -c12-16}
${color1}Tasks ${color2}${processes}${color1}/${color2}${running_processes}${goto 110}${color1}Threads ${color2}${threads}${goto 220}${color1}Pkgs ${color2}${execi 3600 rpm -qa | wc -l}${goto 320}${color1}Failed ${color2}${execi 30 ~/.config/conky/pride/scripts/sys.sh failed_units}${alignr}${color1}KDE Wayland

${color0}${font Terminus (TTF):bold:pixelsize=12}CPU${font}${color3}  ${stippled_hr 1 5}
${voffset 1}${color1}${execi 3600 lscpu | grep 'Model name' | cut -d: -f2 | sed 's/^ *//; s/ [0-9]*-Core Processor//'}${alignr}${color1}gov ${color2}${execi 3600 cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_driver | sed 's/amd-pstate-//'}
${color1}Usage${goto 60}${color2}${cpu cpu0}%${goto 100}${color2}${cpubar cpu0 7,334}
${color1}Freq${goto 60}${color2}${freq_g} GHz${goto 160}${color1}Boost ${color2}${execi 3600 awk '{printf "%.2f", $1/1000000}' /sys/devices/system/cpu/cpu0/cpufreq/cpuinfo_max_freq} GHz${goto 290}${color1}Temp ${color2}${hwmon k10temp temp 1}°C${alignr}${color1}Fans ${color2}${hwmon nct6799 fan 2}${color1}/${color2}${hwmon nct6799 fan 4}
${color1}Ctx/s ${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh ctxt_s}${goto 160}${color1}Intr/s ${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh intr_s}${goto 250}${color1}Power ${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh cpu_power}W${alignr}${color1}Load ${color2}${loadavg 1} ${loadavg 2} ${loadavg 3}
${color4}${cpugraph 28,434 1b0033 a45cff}
${voffset 1}${color1}00${color2}${cpubar cpu1 5,32}${goto 64}${color1}01${color2}${cpubar cpu2 5,32}${goto 118}${color1}02${color2}${cpubar cpu3 5,32}${goto 172}${color1}03${color2}${cpubar cpu4 5,32}${goto 226}${color1}04${color2}${cpubar cpu5 5,32}${goto 280}${color1}05${color2}${cpubar cpu6 5,32}${goto 334}${color1}06${color2}${cpubar cpu7 5,32}${goto 388}${color1}07${color2}${cpubar cpu8 5,32}
${color1}08${color2}${cpubar cpu9 5,32}${goto 64}${color1}09${color2}${cpubar cpu10 5,32}${goto 118}${color1}10${color2}${cpubar cpu11 5,32}${goto 172}${color1}11${color2}${cpubar cpu12 5,32}${goto 226}${color1}12${color2}${cpubar cpu13 5,32}${goto 280}${color1}13${color2}${cpubar cpu14 5,32}${goto 334}${color1}14${color2}${cpubar cpu15 5,32}${goto 388}${color1}15${color2}${cpubar cpu16 5,32}
${voffset 3}${color1}By CPU${goto 150}PID${goto 218}CPU%${goto 286}MEM%${goto 370}RES
${color2}${top name 1}${goto 150}${top pid 1}${goto 212}${top cpu 1}${goto 280}${top mem 1}${goto 362}${top mem_res 1}
${color2}${top name 2}${goto 150}${top pid 2}${goto 212}${top cpu 2}${goto 280}${top mem 2}${goto 362}${top mem_res 2}
${color2}${top name 3}${goto 150}${top pid 3}${goto 212}${top cpu 3}${goto 280}${top mem 3}${goto 362}${top mem_res 3}
${color2}${top name 4}${goto 150}${top pid 4}${goto 212}${top cpu 4}${goto 280}${top mem 4}${goto 362}${top mem_res 4}
${color2}${top name 5}${goto 150}${top pid 5}${goto 212}${top cpu 5}${goto 280}${top mem 5}${goto 362}${top mem_res 5}
${voffset 2}${color1}By RAM${goto 150}PID${goto 218}CPU%${goto 286}MEM%${goto 370}RES
${color2}${top_mem name 1}${goto 150}${top_mem pid 1}${goto 212}${top_mem cpu 1}${goto 280}${top_mem mem 1}${goto 362}${top_mem mem_res 1}
${color2}${top_mem name 2}${goto 150}${top_mem pid 2}${goto 212}${top_mem cpu 2}${goto 280}${top_mem mem 2}${goto 362}${top_mem mem_res 2}
${color2}${top_mem name 3}${goto 150}${top_mem pid 3}${goto 212}${top_mem cpu 3}${goto 280}${top_mem mem 3}${goto 362}${top_mem mem_res 3}

${color0}${font Terminus (TTF):bold:pixelsize=12}GPU${font}${color3}  ${stippled_hr 1 5}
${voffset 1}${color1}${execi 3600 nvidia-smi --query-gpu=name --format=csv,noheader}${alignr}${color1}driver ${color2}${execi 3600 nvidia-smi --query-gpu=driver_version --format=csv,noheader}
${color1}Usage${goto 60}${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh gpu_util}%${goto 100}${color2}${execibar 2 7,334 ~/.config/conky/pride/scripts/w-gpu_util.sh}
${color1}Core${goto 60}${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh gpu_clock} MHz${goto 160}${color1}VRAM clk ${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh gpu_memclock} MHz${goto 320}${color1}PCIe ${color2}${execi 60 ~/.config/conky/pride/scripts/sys.sh gpu_pcie}
${color1}Temp${goto 60}${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh gpu_temp}°C${goto 160}${color1}Fan ${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh gpu_fan}%${goto 250}${color1}State ${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh gpu_pstate}${goto 320}${color1}Mem ld ${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh gpu_memutil}%
${color1}Encode${goto 60}${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh gpu_enc}%${goto 160}${color1}Decode ${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh gpu_dec}%${goto 250}${color1}Top ${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh gpu_app} ${execi 2 ~/.config/conky/pride/scripts/sys.sh gpu_appmem}M
${color1}Power${goto 60}${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh gpu_power}W${color1}/${color2}${execi 60 ~/.config/conky/pride/scripts/sys.sh gpu_plimit}W${goto 160}${color2}${execibar 2 7,274 ~/.config/conky/pride/scripts/w-gpu_pperc.sh}
${color1}VRAM${goto 60}${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh gpu_vused}M${color1}/${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh gpu_vtotal}M${goto 160}${color2}${execibar 2 7,274 ~/.config/conky/pride/scripts/w-gpu_vperc.sh}
${color4}${execigraph 2 ~/.config/conky/pride/scripts/w-gpu_util.sh 28,434 1b0033 a45cff -t}

${color0}${font Terminus (TTF):bold:pixelsize=12}MEMORY${font}${color3}  ${stippled_hr 1 5}
${voffset 1}${color1}RAM${goto 60}${color2}${mem}${color1}/${color2}${memmax}${goto 160}${color2}${memperc}%${goto 200}${color2}${membar 7,234}
${color1}Swap${goto 60}${color2}${swap}${color1}/${color2}${swapmax}${goto 160}${color2}${swapperc}%${goto 200}${color2}${swapbar 7,234}
${color1}Avail ${color2}${memavail}${goto 120}${color1}Cached ${color2}${cached}${goto 250}${color1}Buffers ${color2}${buffers}
${color1}Dirty ${color2}${execi 5 awk '/^Dirty:/{printf "%.0fM", $2/1024}' /proc/meminfo}${goto 120}${color1}Slab ${color2}${execi 5 awk '/^Slab:/{printf "%.0fM", $2/1024}' /proc/meminfo}${goto 250}${color1}Shared ${color2}${execi 5 awk '/^Shmem:/{printf "%.0fM", $2/1024}' /proc/meminfo}
${color1}Page in ${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh pgin_s}/s${goto 160}${color1}Page out ${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh pgout_s}/s${goto 320}${color1}2x16G DDR5-5600

${color0}${font Terminus (TTF):bold:pixelsize=12}VRM & BOARD${font}${color3}  ${stippled_hr 1 5}
${voffset 1}${color1}VCORE${goto 60}${color2}${hwmon nct6799 vol 0} V${goto 160}${color1}VSOC ${color2}${execi 5 sensors -u amdgpu-pci-0f00 | awk '/in1_input/{printf "%.3f", $2}'} V${goto 300}${color1}DIMM ${color2}${hwmon spd5118 temp 1}°C
${color1}Board${goto 60}${color2}${hwmon nct6799 temp 1}°C${goto 160}${color1}Socket ${color2}${hwmon nct6799 temp 2}°C${goto 300}${color1}iGPU ${color2}${execi 5 sensors -u amdgpu-pci-0f00 | awk '/temp1_input/{printf "%.0f", $2}'}°C

${color0}${font Terminus (TTF):bold:pixelsize=12}STORAGE${font}${color3}  ${stippled_hr 1 5}
${voffset 1}${color0}${execi 60 ~/.config/conky/pride/scripts/sys.sh model_root}${alignr}${color1}temp ${color2}${execi 5 ~/.config/conky/pride/scripts/sys.sh temp_root}°C
${color1} root ${color1}btrfs${goto 104}${color2}${fs_used /}${color1}/${color2}${fs_size /}${goto 180}${color2}${fs_bar 6,150 /}${goto 344}${color2}${fs_used_perc /}%${alignr}${color1}inode ${color2}${execi 60 df --output=ipcent / | tail -1 | tr -d ' '}
${color1} boot ${color1}ext4${goto 104}${color2}${fs_used /boot}${color1}/${color2}${fs_size /boot}${goto 180}${color2}${fs_bar 6,150 /boot}${goto 344}${color2}${fs_used_perc /boot}%${alignr}${color1}inode ${color2}${execi 60 df --output=ipcent /boot | tail -1 | tr -d ' '}
${voffset 2}${color0}${execi 60 ~/.config/conky/pride/scripts/sys.sh model_p980}${alignr}${color1}temp ${color2}${execi 5 ~/.config/conky/pride/scripts/sys.sh temp_p980}°C
${color1} 980pro ${color1}ext4${goto 104}${color2}${fs_used /mnt/samsung-980pro}${color1}/${color2}${fs_size /mnt/samsung-980pro}${goto 180}${color2}${fs_bar 6,150 /mnt/samsung-980pro}${goto 344}${color2}${fs_used_perc /mnt/samsung-980pro}%${alignr}${color1}inode ${color2}${execi 60 df --output=ipcent /mnt/samsung-980pro | tail -1 | tr -d ' '}
${voffset 2}${color0}${execi 60 ~/.config/conky/pride/scripts/sys.sh model_kingston}
${color1} kingston ${color1}ext4${goto 104}${color2}${fs_used /mnt/ssd-kingston}${color1}/${color2}${fs_size /mnt/ssd-kingston}${goto 180}${color2}${fs_bar 6,150 /mnt/ssd-kingston}${goto 344}${color2}${fs_used_perc /mnt/ssd-kingston}%${alignr}${color1}inode ${color2}${execi 60 df --output=ipcent /mnt/ssd-kingston | tail -1 | tr -d ' '}

${color0}${font Terminus (TTF):bold:pixelsize=12}HEADSET${font}${color3}  ${stippled_hr 1 5}
${voffset 1}${color1}Corsair VOID Elite${goto 160}${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh hs_display}${goto 200}${color2}${execibar 2 7,160 ~/.config/conky/pride/scripts/w-hs_level.sh}${alignr}${color2}${execi 2 ~/.config/conky/pride/scripts/sys.sh hs_status}

${color0}${font Terminus (TTF):bold:pixelsize=12}NETWORK${font}${color3}  ${stippled_hr 1 5}
${voffset 1}${color1}enp7s0${goto 60}${color2}${addr enp7s0}${goto 190}${color1}link ${color2}${execi 60 cat /sys/class/net/enp7s0/speed}Mb${goto 300}${color1}mtu ${color2}${execi 60 cat /sys/class/net/enp7s0/mtu}
${color1}Gateway ${color2}${execi 60 ip route show default | awk '{print $3}'}${goto 190}${color1}DNS ${color2}${execi 60 resolvectl dns enp7s0 2>/dev/null | awk '{print $4, $5}'}
${voffset 2}${color1}Down ${color2}${downspeed enp7s0}/s${goto 160}${color1}RX ${color2}${totaldown enp7s0}${alignr}${color1}pkts ${color2}${execi 5 cat /sys/class/net/enp7s0/statistics/rx_packets}
${color4}${downspeedgraph enp7s0 27,434 2e00d1 d1002e}
${color1}Up ${color2}${upspeed enp7s0}/s${goto 160}${color1}TX ${color2}${totalup enp7s0}${alignr}${color1}pkts ${color2}${execi 5 cat /sys/class/net/enp7s0/statistics/tx_packets}
${color4}${upspeedgraph enp7s0 27,434 2e00d1 d1002e}
${voffset 2}${color1}Errors ${color2}${execi 10 cat /sys/class/net/enp7s0/statistics/rx_errors}${color1}/${color2}${execi 10 cat /sys/class/net/enp7s0/statistics/tx_errors}${goto 120}${color1}Dropped ${color2}${execi 10 cat /sys/class/net/enp7s0/statistics/rx_dropped}${color1}/${color2}${execi 10 cat /sys/class/net/enp7s0/statistics/tx_dropped}${goto 270}${color1}Conns ${color2}${tcp_portmon 1 65535 count}
${color1}Estab ${color2}${execi 5 ~/.config/conky/pride/scripts/sys.sh tcp_estab}${goto 120}${color1}Listen ${color2}${execi 5 ~/.config/conky/pride/scripts/sys.sh tcp_listen}${goto 270}${color1}Time-wait ${color2}${execi 5 ~/.config/conky/pride/scripts/sys.sh tcp_tw}
${voffset 2}${color1}Remote host${goto 300}service${alignr}port
${color2}${tcp_portmon 32768 60999 rhost 0}${goto 300}${tcp_portmon 32768 60999 rservice 0}${alignr}${tcp_portmon 32768 60999 rport 0}
${color2}${tcp_portmon 32768 60999 rhost 1}${goto 300}${tcp_portmon 32768 60999 rservice 1}${alignr}${tcp_portmon 32768 60999 rport 1}
${color2}${tcp_portmon 32768 60999 rhost 2}${goto 300}${tcp_portmon 32768 60999 rservice 2}${alignr}${tcp_portmon 32768 60999 rport 2}
${voffset 2}${color1}Inbound host${goto 300}service${alignr}local port
${color2}${tcp_portmon 1 32767 rhost 0}${goto 300}${tcp_portmon 1 32767 rservice 0}${alignr}${tcp_portmon 1 32767 lport 0}
${color2}${tcp_portmon 1 32767 rhost 1}${goto 300}${tcp_portmon 1 32767 rservice 1}${alignr}${tcp_portmon 1 32767 lport 1}
]]
